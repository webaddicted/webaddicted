<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#21262D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="#0D1117" rx="10" stroke="#30363D" stroke-width="1"/>
  <text x="20" y="30" fill="#E6EDF3" font-size="14" font-family="Segoe UI, system-ui, sans-serif" font-weight="600">Top Languages</text>
  <!-- Kotlin 45% -->
  <text x="20" y="60" fill="#8B949E" font-size="11" font-family="monospace">Kotlin</text>
  <rect x="80" y="50" width="280" height="14" rx="7" fill="url(#barBg)"/>
  <rect x="80" y="50" width="126" height="14" rx="7" fill="#7F52FF">
    <animate attributeName="width" from="0" to="126" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="370" y="62" fill="#7F52FF" font-size="10" font-family="monospace">45%</text>
  <!-- Dart 30% -->
  <text x="20" y="90" fill="#8B949E" font-size="11" font-family="monospace">Dart</text>
  <rect x="80" y="80" width="280" height="14" rx="7" fill="url(#barBg)"/>
  <rect x="80" y="80" width="84" height="14" rx="7" fill="#54C5F8">
    <animate attributeName="width" from="0" to="84" dur="1.5s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="370" y="92" fill="#54C5F8" font-size="10" font-family="monospace">30%</text>
  <!-- Java 15% -->
  <text x="20" y="120" fill="#8B949E" font-size="11" font-family="monospace">Java</text>
  <rect x="80" y="110" width="280" height="14" rx="7" fill="url(#barBg)"/>
  <rect x="80" y="110" width="42" height="14" rx="7" fill="#00B9AE">
    <animate attributeName="width" from="0" to="42" dur="1.5s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="370" y="122" fill="#00B9AE" font-size="10" font-family="monospace">15%</text>
  <!-- Other 10% -->
  <text x="20" y="150" fill="#8B949E" font-size="11" font-family="monospace">Other</text>
  <rect x="80" y="140" width="280" height="14" rx="7" fill="url(#barBg)"/>
  <rect x="80" y="140" width="28" height="14" rx="7" fill="#8B949E">
    <animate attributeName="width" from="0" to="28" dur="1.5s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="370" y="152" fill="#8B949E" font-size="10" font-family="monospace">10%</text>
  <!-- Footer -->
  <text x="20" y="185" fill="#484F58" font-size="10" font-family="Segoe UI, system-ui, sans-serif">Android · Flutter · Mobile Architecture</text>
</svg>
