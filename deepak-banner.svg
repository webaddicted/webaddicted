  <rect x="340" y="235" width="100" height="28" rx="14" fill="#54C5F8" opacity="0.15" stroke="#54C5F8" stroke-width="1"/>
  <text x="390" y="254" text-anchor="middle" fill="#54C5F8" font-size="12" font-family="monospace">FLUTTER</text>
  <rect x="450" y="235" width="90" height="28" rx="14" fill="#00B9AE" opacity="0.15" stroke="#00B9AE" stroke-width="1"/>
