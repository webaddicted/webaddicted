  <circle cx="125" cy="218" r="6" fill="none" stroke="#00B9AE" stroke-width="1.5"/>
  <text x="220" y="130" fill="url(#textGrad)" font-size="50" font-family="Arial, Helvetica, sans-serif" font-weight="700" filter="url(#glow)">Deepak Sharma</text>
  <text x="220" y="175" fill="#E6EDF3" font-size="22" font-family="Arial, Helvetica, sans-serif">Technical Lead - Android and Flutter</text>
  <text x="220" y="210" fill="#8B949E" font-size="16" font-family="Arial, Helvetica, sans-serif">9+ Years | Kotlin | Jetpack Compose | Clean Architecture | MCP/AI</text>
