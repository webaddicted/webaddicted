  <text x="220" y="295" fill="#8B949E" font-size="14" font-family="Arial, Helvetica, sans-serif">Gurugram, India | @webaddicted</text>
  <rect x="680" y="108" width="3" height="28" fill="#7F52FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
