<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7F52FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#54C5F8" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="50%" stop-color="#54C5F8"/>
      <stop offset="100%" stop-color="#00B9AE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="320" fill="url(#shimmer)" rx="12" opacity="0.3"/>
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#54C5F8" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/><line x1="900" y1="0" x2="900" y2="320"/>
  </g>
  <!-- Floating Kotlin diamond -->
  <g transform="translate(980,60)" opacity="0.9">
    <polygon points="30,0 60,30 30,60 0,30" fill="#7F52FF" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="980,60;985,55;980,60" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <text x="30" y="35" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace" font-weight="bold">K</text>
  </g>
  <!-- Floating Flutter -->
  <g transform="translate(1050,180)" opacity="0.85">
    <path d="M20,0 L40,20 L20,40 L0,20 Z" fill="#54C5F8">
      <animateTransform attributeName="transform" type="translate" values="1050,180;1045,185;1050,180" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <text x="20" y="25" text-anchor="middle" fill="#02569B" font-size="9" font-family="monospace" font-weight="bold">F</text>
  </g>
  <!-- Phone outline -->
  <rect x="80" y="70" width="90" height="160" rx="12" fill="none" stroke="#7F52FF" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="88" y="85" width="74" height="120" rx="4" fill="#161B22" stroke="#54C5F8" stroke-width="1" opacity="0.5"/>
  <circle cx="125" cy="218" r="6" fill="none" stroke="#00B9AE" stroke-width="1.5"/>
  <!-- Main text -->
  <text x="220" y="130" fill="url(#textGrad)" font-size="52" font-family="Segoe UI, system-ui, sans-serif" font-weight="700" filter="url(#glow)">Deepak Sharma</text>
  <text x="220" y="175" fill="#E6EDF3" font-size="22" font-family="Segoe UI, system-ui, sans-serif" font-weight="400">Technical Lead  Android &amp; Flutter</text>
  <text x="220" y="210" fill="#8B949E" font-size="16" font-family="Segoe UI, system-ui, sans-serif">9+ Years · Kotlin · Jetpack Compose · Clean Architecture · MCP/AI</text>
  <!-- Badge pills -->
  <rect x="220" y="235" width="110" height="28" rx="14" fill="#7F52FF" opacity="0.2" stroke="#7F52FF" stroke-width="1"/>
  <text x="275" y="254" text-anchor="middle" fill="#7F52FF" font-size="12" font-family="monospace">KOTLIN</text>
  <rect x="340" y="235" width="100" height="28" rx="14" fill="#54C5F8" opacity="0.15" stroke="#54C5F8" stroke-width="1"/>
  <text x="390" y="254" text-anchor="middle" fill="#54C5F8" font-size="12" font-family="monospace">FLUTTER</text>
  <rect x="450" y="235" width="90" height="28" rx="14" fill="#00B9AE" opacity="0.15" stroke="#00B9AE" stroke-width="1"/>
  <text x="495" y="254" text-anchor="middle" fill="#00B9AE" font-size="12" font-family="monospace">FINTECH</text>
  <!-- Location -->
  <text x="220" y="295" fill="#8B949E" font-size="14" font-family="Segoe UI, system-ui, sans-serif">=Í Gurugram, India · @webaddicted</text>
  <!-- Animated cursor -->
  <rect x="680" y="108" width="3" height="28" fill="#7F52FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
